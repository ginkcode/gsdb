name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            squashfs-tools \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run tauri:build -- --bundles appimage,deb,rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: GSDB-linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-14
            arch: aarch64
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npx tauri build --bundles dmg --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: GSDB-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: npx tauri build --bundles nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: GSDB-windows-amd64
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.dmg
            artifacts/**/*.exe
          generate_release_notes: false
          body: "Release ${{ github.ref_name }} of GSDB - Database Management Tool"

  publish-linux-packages:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: GSDB-linux-*
          path: artifacts
          merge-multiple: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c gnupg

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-secret-keys

      - name: Checkout ginkcode.github.io repo
        uses: actions/checkout@v5
        with:
          repository: ginkcode/ginkcode.github.io
          token: ${{ secrets.RELEASE_PAGES_TOKEN }}
          path: repo

      - name: Build apt repository
        run: |
          mkdir -p repo/gsdb/apt/conf
          cat > repo/gsdb/apt/conf/distributions << EOF
          Origin: GSDB
          Label: GSDB
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: GSDB - Database Management Tool
          SignWith: ${{ secrets.GPG_KEY_ID }}
          EOF

          cat > repo/gsdb/apt/conf/options << EOF
          ask-passphrase
          EOF

          find artifacts -name "*.deb" | while read deb; do
            reprepro -b repo/gsdb/apt --ask-passphrase includedeb stable "$deb" || \
            reprepro -b repo/gsdb/apt includedeb stable "$deb" || true
          done

      - name: Build RPM repository
        run: |
          mkdir -p repo/gsdb/rpm
          find artifacts -name "*.rpm" -exec cp -n {} repo/gsdb/rpm/ \;
          createrepo_c repo/gsdb/rpm/
          gpg --batch --detach-sign --armor \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            repo/gsdb/rpm/repodata/repomd.xml || true

      - name: Export GPG public key
        run: |
          gpg --armor --export "${{ secrets.GPG_KEY_ID }}" > repo/gsdb/gpg.key

      - name: Create install instructions
        run: |
          if [ ! -f repo/gsdb/index.html ]; then
            cat > repo/gsdb/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>GSDB Package Repository</title></head>
          <body>
          <h1>GSDB Package Repository</h1>
          <h2>Debian/Ubuntu (apt)</h2>
          <pre>
          curl -fsSL https://ginkcode.github.io/gsdb/gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gsdb.gpg
          echo "deb [signed-by=/usr/share/keyrings/gsdb.gpg] \
            https://ginkcode.github.io/gsdb/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/gsdb.list
          sudo apt update
          sudo apt install gsdb
          </pre>
          <h2>RHEL/Fedora (yum/dnf)</h2>
          <pre>
          sudo rpm --import https://ginkcode.github.io/gsdb/gpg.key
          sudo tee /etc/yum.repos.d/gsdb.repo &lt;&lt; 'REPO'
          [gsdb]
          name=GSDB Repository
          baseurl=https://ginkcode.github.io/gsdb/rpm
          enabled=1
          gpgcheck=1
          gpgkey=https://ginkcode.github.io/gsdb/gpg.key
          REPO
          sudo dnf install gsdb
          </pre>
          </body>
          </html>
          EOF
          fi

      - name: Commit and push to ginkcode.github.io
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update gsdb packages for ${{ github.ref_name }}"
          git push origin main
